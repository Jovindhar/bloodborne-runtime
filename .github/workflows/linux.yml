# Compile the Vulkan runtime on Linux and run its native unit tests.
# Manual only for now (Actions → Linux → Run workflow) while the work is on macOS; restore the
# push and pull_request triggers when Linux work resumes.
name: Linux

on:
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Build
        run: nix-shell shell.nix --run 'bash build.sh'
      - name: Test resource storage, adapter handles, upload baselines and trophy notices
        run: |
          nix-shell shell.nix --run 'set -e
          ninja -C out/gpu slot-vector-test handle-table-test image-upload-hash-test trophy-queue-test
          out/gpu/slot-vector-test
          out/gpu/handle-table-test
          out/gpu/image-upload-hash-test
          out/gpu/trophy-queue-test'
